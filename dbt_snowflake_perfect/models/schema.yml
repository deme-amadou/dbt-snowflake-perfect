version: 2

models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        description: "The unique identifier for the listing"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "The unique identifier for the host. References the dim_hosts_cleansed table"
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id
      - name: room_type
        description: "The type of room"
        tests:
          - accepted_values:
              values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights")}}'
        tests:
          - positive_value
  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              quantile: .99 #99 of the price should be between min_value and max_value
              min_value: 50
              max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              max_value: 5000 # The max value of our price should be 5000 (to avoid outliers)
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number #depends on the backend (snowflake number here)
  - name: dim_hosts_cleansed
    description: "This table contains information about the hosts"
    columns:
      - name: host_name
        description: "The name of the host"
        tests:
          - not_null