version: 2

models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        description: "The unique identifier for the listing"
        tests:
          - unique
          - not_null
      - name: host_id
        description: "The unique identifier for the host. References the dim_hosts_cleansed table"
        tests:
          - not_null
          - relationships:
              to: ref('dim_hosts_cleansed')
              field: host_id
      - name: room_type
        description: "The type of room"
        tests:
          - accepted_values:
              values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights")}}'
        tests:
          - positive_value
  - name: dim_hosts_cleansed
    description: "This table contains information about the hosts"
    columns:
      - name: host_name
        description: "The name of the host"
        tests:
          - not_null